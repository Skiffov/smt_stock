{% extends 'base.html' %}{% block content %}<h1>Облікові записи</h1><form method="post" class="card form-grid"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>ПІБ / ім’я *<input name="name" required></label><label>Штрихкод картки *<input name="card_code" required></label><label>Роль<select name="role">{% for k,v in roles.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></label><div class="full"><button>Створити користувача</button></div></form><div class="table-wrap"><table><tr><th>Користувач</th><th>Код картки</th><th>Роль</th><th>Стан</th><th></th></tr>{% for u in rows %}<tr><td>{{ u.name }}</td><td>{{ u.card_code }}</td><td>{{ roles[u.role] }}</td><td>{{ 'Активний' if u.active else 'Деактивований' }}</td><td>{% if u.id!=session.user.id %}<form method="post" action="{{ url_for('toggle_user',uid=u.id) }}"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button class="secondary">{{ 'Деактивувати' if u.active else 'Активувати' }}</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
