{% extends 'base.html' %}{% block content %}<h1>Надходження компонента</h1><form method="post" class="card form-grid"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Компонент *<select name="component_id" required>{% for c in comps %}<option value="{{ c.id }}">{{ c.code }} — {{ c.name }}</option>{% endfor %}</select></label><label>Мітка упаковки / рулону *<input name="label" required></label><label>Виробник *<input name="manufacturer" required placeholder="Yageo, Vishay…"></label><label>MPN *<input name="mpn" required placeholder="Маркування виробника"></label><label>Кількість компонентів у штуках *<input name="quantity" type="number" min="1" required></label><label>Тип пакування<select name="package_type">{% for t in package_types %}<option>{{ t }}</option>{% endfor %}</select></label><label>Місце зберігання<input name="location" value="Склад"></label><label>Стан пакування<select name="packaging_status">{% for s in packaging %}<option>{{ s }}</option>{% endfor %}</select></label><label class="full">Причина блокування / пошкодження (обов’язкова для непридатного стану)<textarea name="block_reason" placeholder="Наприклад: пошкоджена стрічка, потребує перевірки"></textarea></label><div class="full"><button>Оприбуткувати</button></div></form>{% endblock %}
