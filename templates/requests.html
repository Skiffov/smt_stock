{% extends 'base.html' %}{% block content %}<h1>Черга заявок</h1><form method="get" class="filters"><label>Пошук<input name="q" value="{{ q }}" placeholder="Проєкт, серійний №, оператор"></label><label>Статус<select name="status"><option value="">Усі</option>{% for key,title in statuses.items() %}<option value="{{ key }}" {% if status==key %}selected{% endif %}>{{ title }}</option>{% endfor %}</select></label><button>Застосувати</button><a href="{{ url_for('requests_page') }}">Скинути</a></form><div class="table-wrap"><table><tr><th>Заявка</th><th>Проєкт</th><th>KIT-оператор</th><th>Статус</th><th>Створено</th></tr>{% for r in rows %}<tr><td><a href="{{ url_for('request_detail',rid=r.id) }}">#{{ r.id }}</a></td><td>{{ r.project_name }} · {{ r.serial }}</td><td>{{ r.operator_name }}</td><td>{{ statuses[r.status] }}</td><td>{{ r.created_at }}</td></tr>{% else %}<tr><td colspan="5">Черга порожня.</td></tr>{% endfor %}</table></div>{% endblock %}
